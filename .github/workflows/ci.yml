name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, analyse and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, xml, mbstring, intl, fileinfo, pdo_sqlite, sqlite3, zip, gd
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The tracker import/export tests run the real scripts from the
      # bundled venv (config('ledger.import.python_bin')).
      - name: Python venv for the tracker scripts
        run: |
          python -m venv python/venv
          python/venv/bin/pip install --quiet -r python/requirements.txt

      # Lockfiles are not committed in this repository, so dependencies
      # resolve fresh on each run.
      - name: Composer install
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: npm install
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: php artisan test
